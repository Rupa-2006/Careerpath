# Render Blueprint for PathMithra (free plan).
# - pathmithra-api: the FastAPI server. Its database is on Neon; the link is entered once in Render, never stored here.
# - pathmithra: the website. Requests to /api/ are passed to the server, so logins work on one address.
services:
  - type: web
    name: pathmithra-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/v1/fields
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # paste the Neon connection link in Render when asked
      - key: ALLOWED_ORIGINS
        value: https://pathmithra.onrender.com
      - key: SHOW_UNPUBLISHED
        value: "false"
      # Account emails (password reset codes) through Brevo's free SMTP. The login, key and sender are entered in Render.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"   # Render's free plan blocks the usual mail ports (25, 465, 587); Brevo also listens on 2525
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: pathmithra
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pathmithra-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
