# Checks once a day that PathMithra is up. If it is down, this job fails and GitHub emails the repository owner.
# The free server sleeps when idle, so each check waits and tries a few times before calling it down.
name: Is PathMithra up?

on:
  schedule:
    - cron: "0 4 * * *"    # 04:00 UTC = 9:30 in India, after the daily update
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Website opens
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 90 https://pathmithra.onrender.com/ | grep -q "PathMithra"; then echo "Website is up"; exit 0; fi
            echo "Try $i failed, waiting"; sleep 30
          done
          echo "::error::The PathMithra website did not open after 6 tries"; exit 1
      - name: Courses load
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 90 "https://pathmithra.onrender.com/api/v1/courses?field=engineering" | grep -q '"total"'; then echo "Courses load"; exit 0; fi
            echo "Try $i failed, waiting"; sleep 30
          done
          echo "::error::Courses did not load: the server or the database may be down"; exit 1
