# The online version of the 9am daily job. Runs on GitHub every day, even when the laptop is off.
# It needs one secret in the repository settings: DATABASE_URL (the Neon connection link).
name: Daily CareerPath update

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 9:00 in India
  workflow_dispatch: {}      # also lets you run it by hand from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - name: Check official pages for changes
        run: python -m scripts.watch_sources
        continue-on-error: true
      - name: Collect career news
        run: python -m scripts.fetch_updates
        continue-on-error: true
      - name: Sync the official course list
        run: python -m scripts.sync_official
        continue-on-error: true
      - name: Clean up old alerts and waiting records
        run: python -m scripts.auto_tidy
